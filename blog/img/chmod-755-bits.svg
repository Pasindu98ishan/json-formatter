<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-labelledby="t d">
  <title id="t">chmod 755 permission bits</title>
  <desc id="d">Owner has read, write, execute (7, binary 111). Group and others have read and execute only (5, binary 101). Symbolic mode rwxr-xr-x.</desc>
  <style>
    text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .pb-mode{fill:#1a1a1a;font-weight:700}.pb-sym{fill:#007bff;font-weight:700}
    .pb-label{fill:#6c757d;font-weight:700}.pb-digit{fill:#1a1a1a;font-weight:700}.pb-binary{fill:#868e96}
    .pb-card-fill{fill:#f8f9fa}.pb-card-stroke{stroke:#dee2e6}
    .pb-granted-fill{fill:#d4edda}.pb-granted-text{fill:#155724}
    .pb-denied-fill{fill:#e9ecef}.pb-denied-text{fill:#adb5bd}
  </style>
  <rect width="640" height="210" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle"><tspan class="pb-mode" font-size="19">chmod 755</tspan><tspan class="pb-sym" font-size="19"> = rwxr-xr-x</tspan></text>
  <rect class="pb-card-fill pb-card-stroke" x="20" y="44" width="186" height="150" rx="12"/>
  <text class="pb-label" x="113" y="66" text-anchor="middle" font-size="12" letter-spacing="1.5">OWNER</text>
  <text x="113" y="98" text-anchor="middle"><tspan class="pb-digit" font-size="24">7</tspan><tspan class="pb-binary" font-size="13" dx="6">111</tspan></text>
  <rect class="pb-granted-fill" x="32" y="116" width="50" height="50" rx="8"/><text class="pb-granted-text" x="57" y="140" text-anchor="middle" font-size="18" font-weight="700">r</text><text class="pb-granted-text" x="57" y="158" text-anchor="middle" font-size="11">4</text>
  <rect class="pb-granted-fill" x="88" y="116" width="50" height="50" rx="8"/><text class="pb-granted-text" x="113" y="140" text-anchor="middle" font-size="18" font-weight="700">w</text><text class="pb-granted-text" x="113" y="158" text-anchor="middle" font-size="11">2</text>
  <rect class="pb-granted-fill" x="144" y="116" width="50" height="50" rx="8"/><text class="pb-granted-text" x="169" y="140" text-anchor="middle" font-size="18" font-weight="700">x</text><text class="pb-granted-text" x="169" y="158" text-anchor="middle" font-size="11">1</text>
  <rect class="pb-card-fill pb-card-stroke" x="226" y="44" width="186" height="150" rx="12"/>
  <text class="pb-label" x="319" y="66" text-anchor="middle" font-size="12" letter-spacing="1.5">GROUP</text>
  <text x="319" y="98" text-anchor="middle"><tspan class="pb-digit" font-size="24">5</tspan><tspan class="pb-binary" font-size="13" dx="6">101</tspan></text>
  <rect class="pb-granted-fill" x="238" y="116" width="50" height="50" rx="8"/><text class="pb-granted-text" x="263" y="140" text-anchor="middle" font-size="18" font-weight="700">r</text><text class="pb-granted-text" x="263" y="158" text-anchor="middle" font-size="11">4</text>
  <rect class="pb-denied-fill" x="294" y="116" width="50" height="50" rx="8"/><text class="pb-denied-text" x="319" y="141" text-anchor="middle" font-size="18" font-weight="700">&#8211;</text><text class="pb-denied-text" x="319" y="158" text-anchor="middle" font-size="11">2</text>
  <rect class="pb-granted-fill" x="350" y="116" width="50" height="50" rx="8"/><text class="pb-granted-text" x="375" y="140" text-anchor="middle" font-size="18" font-weight="700">x</text><text class="pb-granted-text" x="375" y="158" text-anchor="middle" font-size="11">1</text>
  <rect class="pb-card-fill pb-card-stroke" x="432" y="44" width="186" height="150" rx="12"/>
  <text class="pb-label" x="525" y="66" text-anchor="middle" font-size="12" letter-spacing="1.5">OTHERS</text>
  <text x="525" y="98" text-anchor="middle"><tspan class="pb-digit" font-size="24">5</tspan><tspan class="pb-binary" font-size="13" dx="6">101</tspan></text>
  <rect class="pb-granted-fill" x="444" y="116" width="50" height="50" rx="8"/><text class="pb-granted-text" x="469" y="140" text-anchor="middle" font-size="18" font-weight="700">r</text><text class="pb-granted-text" x="469" y="158" text-anchor="middle" font-size="11">4</text>
  <rect class="pb-denied-fill" x="500" y="116" width="50" height="50" rx="8"/><text class="pb-denied-text" x="525" y="141" text-anchor="middle" font-size="18" font-weight="700">&#8211;</text><text class="pb-denied-text" x="525" y="158" text-anchor="middle" font-size="11">2</text>
  <rect class="pb-granted-fill" x="556" y="116" width="50" height="50" rx="8"/><text class="pb-granted-text" x="581" y="140" text-anchor="middle" font-size="18" font-weight="700">x</text><text class="pb-granted-text" x="581" y="158" text-anchor="middle" font-size="11">1</text>
</svg>
