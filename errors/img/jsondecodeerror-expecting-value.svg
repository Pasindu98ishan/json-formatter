<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 212" width="700" height="212" role="img" aria-labelledby="jsondecodeerrorexpecT jsondecodeerrorexpecD">
  <title id="jsondecodeerrorexpecT">Terminal showing json.decoder.JSONDecodeError Expecting value line 1 column 1 char 0</title>
  <desc id="jsondecodeerrorexpecD">A terminal running python fetch_config.py. The script calls json.loads on an empty response body. Python prints a traceback through json/__init__.py loads and json/decoder.py raw_decode, ending in json.decoder.JSONDecodeError: Expecting value: line 1 column 1 (char 0). char 0 means the decoder failed on the very first byte, so the body was empty or was not JSON at all.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="212" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">bash — Python 3.14.6</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">python fetch_config.py</tspan></text>
  <text class="mono ok" xml:space="preserve" x="16" y="70">Traceback (most recent call last):</text>
  <text class="mono detail" xml:space="preserve" x="16" y="88">  File "fetch_config.py", line 4, in &lt;module&gt;</text>
  <text class="mono detail" xml:space="preserve" x="16" y="106">    data = json.loads(resp_body)</text>
  <text class="mono detail" xml:space="preserve" x="16" y="124">  File ".../json/decoder.py", line 363, in raw_decode</text>
  <text class="mono detail" xml:space="preserve" x="16" y="142">    raise JSONDecodeError("Expecting value", s, err.value) from None</text>
  <text class="mono err" xml:space="preserve" x="16" y="160">json.decoder.JSONDecodeError: Expecting value: line 1 column 1 (char 0)</text>
  <text class="mono ok" xml:space="preserve" x="16" y="190">↑ "char 0" = it failed on the FIRST byte. The body was empty, or was never JSON.</text>
</svg>
