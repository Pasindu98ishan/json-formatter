<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 188" width="700" height="188" role="img" aria-labelledby="dockercontainerexiteT dockercontainerexiteD">
  <title id="dockercontainerexiteT">Terminal showing docker inspect reporting ExitCode 137 and OOMKilled true</title>
  <desc id="dockercontainerexiteD">A terminal running a container under a 32 megabyte memory limit with a process that keeps allocating. docker ps -a shows Exited (137). docker inspect reports Status exited, ExitCode 137 and, decisively, OOMKilled true — which is the only field that distinguishes a kernel out-of-memory kill from any other SIGKILL, since both produce exit code 137.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="188" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">sh — Docker CLI</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">docker run -d --name app -m 32m --memory-swap 32m myimage</tspan></text>
  <text class="mono" xml:space="preserve" x="16" y="70"><tspan class="prompt">$ </tspan><tspan class="cmd">docker ps -a --format '{{.Status}}'</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="88">Exited (137) 1 second ago</text>
  <text class="mono" xml:space="preserve" x="16" y="118"><tspan class="prompt">$ </tspan><tspan class="cmd">docker inspect -f 'ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}}' app</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="136">ExitCode=137 OOMKilled=true</text>
  <text class="mono ok" xml:space="preserve" x="16" y="166">↑ 137 alone only means SIGKILL. OOMKilled=true is what proves the kernel did it.</text>
</svg>
