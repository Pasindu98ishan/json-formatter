<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="t d">
  <title id="t">How an unterminated string breaks JSON parsing</title>
  <desc id="d">A valid JSON object closes every string with a matching double quote. An unterminated string opens with a quote but never closes it, so the parser reaches the end of input and fails, pointing back to where the string started.</desc>
  <style>
    text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Consolas',monospace}
    .title{fill:#1a1a1a;font-weight:700}.caption{fill:#555}
    .ok-fill{fill:#d4edda}.ok-text{fill:#155724}
    .bad-fill{fill:#f8d7da}.bad-stroke{stroke:#dc3545;stroke-width:2}.bad-text{fill:#721c24}
  </style>
  <rect width="640" height="220" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" class="title" font-size="16">A string that never closes</text>
  <rect class="ok-fill" x="40" y="48" width="560" height="52" rx="10"/>
  <text x="60" y="70" font-size="11" font-weight="700" class="ok-text" letter-spacing="1">VALID</text>
  <text x="60" y="90" class="mono ok-text" font-size="15">{"name": "Alice"}  &#8592; opening and closing quotes both present</text>
  <rect class="bad-fill bad-stroke" x="40" y="120" width="560" height="52" rx="10"/>
  <text x="60" y="142" font-size="11" font-weight="700" class="bad-text" letter-spacing="1">UNTERMINATED</text>
  <text x="60" y="162" class="mono bad-text" font-size="15">{"name": "Alice}   &#8592; no closing quote &rarr; parser runs to end</text>
  <text x="320" y="200" text-anchor="middle" class="caption" font-size="13">The error reports where the open string started (char 9), not where it should have ended.</text>
</svg>
