<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 212" width="700" height="212" role="img" aria-labelledby="javacannotfindsymbolT javacannotfindsymbolD">
  <title id="javacannotfindsymbolT">Terminal showing javac error: cannot find symbol with the symbol and location lines</title>
  <desc id="javacannotfindsymbolD">A terminal running javac Order.java. javac reports Order.java line 6, error: cannot find symbol, echoes the offending source line int total = calculateTotal(items); and points a caret at calculateTotal. Two further lines read symbol: method calculateTotal(List&lt;String&gt;) and location: class Order, followed by 1 error. The symbol line says what javac looked for; the location line says where it looked.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="212" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">bash — javac 21.0.11</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">javac Order.java</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="70">Order.java:6: error: cannot find symbol</text>
  <text class="mono detail" xml:space="preserve" x="16" y="88">        int total = calculateTotal(items);</text>
  <text class="mono caret" xml:space="preserve" x="16" y="106">                    ^</text>
  <text class="mono detail" xml:space="preserve" x="16" y="124">  symbol:   method calculateTotal(List&lt;String&gt;)</text>
  <text class="mono detail" xml:space="preserve" x="16" y="142">  location: class Order</text>
  <text class="mono ok" xml:space="preserve" x="16" y="160">1 error</text>
  <text class="mono ok" xml:space="preserve" x="16" y="190">↑ symbol: = what javac looked for.  location: = where it looked. Both lines matter.</text>
</svg>
