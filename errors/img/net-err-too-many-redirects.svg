<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 273" width="700" height="273" role="img" aria-labelledby="neterrtoomanyredirecT neterrtoomanyredirecD">
  <title id="neterrtoomanyredirecT">Chrome error page reading This page isn't working, redirected you too many times, ERR_TOO_MANY_REDIRECTS</title>
  <desc id="neterrtoomanyredirecD">Chrome's error page for a redirect loop. The heading reads This page isn't working, the body says the host redirected you too many times, and Chrome suggests Try deleting your cookies. The error code at the bottom is ERR_TOO_MANY_REDIRECTS.</desc>
  <style>
    .page{fill:#ffffff}
    .chrome{fill:#dee1e6}
    .omnibox{fill:#ffffff}
    .h1{fill:#202124;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:21px}
    .p{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px}
    .code{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.3px}
    .btn{fill:#1a73e8}
    .btntext{fill:#ffffff;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600}
    .urltext{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px}
    .bullet{fill:#5f6368}
    .tab{fill:#ffffff}
    .tabtext{fill:#3c4043;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
  </style>

  <rect class="page" x="0" y="0" width="700" height="273" rx="8"/>
  <rect class="chrome" x="0" y="0" width="700" height="64" rx="8"/>
  <rect class="chrome" x="0" y="40" width="700" height="24"/>
  <rect class="tab" x="10" y="8" width="200" height="28" rx="6"/>
  <text class="tabtext" x="24" y="27">This page isn't working</text>
  <rect class="omnibox" x="10" y="40" width="680" height="22" rx="11"/>
  <text class="urltext" x="26" y="55">http://app.example.com/dashboard</text>

  <text class="h1" x="48" y="118">This page isn't working</text>
  <text class="p" x="48" y="152">app.example.com redirected you too many times.</text>
  <text class="code" x="48" y="187">ERR_TOO_MANY_REDIRECTS</text>
  <rect class="btn" x="48" y="213" width="86" height="32" rx="16"/>
  <text class="btntext" x="91" y="234" text-anchor="middle">Reload</text>
</svg>
