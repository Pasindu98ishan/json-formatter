<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 248" width="700" height="248" role="img" aria-labelledby="ruste0277traitboundnT ruste0277traitboundnD">
  <title id="ruste0277traitboundnT">Terminal showing rustc error E0277 the trait bound Id Hash is not satisfied with a derive suggestion</title>
  <desc id="ruste0277traitboundnD">A terminal running rustc. The compiler reports error[E0277]: the trait bound `Id: Hash` is not satisfied at bound.rs line 8, underlines the insert call with the trait `Hash` is not implemented for `Id`, notes that the bound is required by HashSet insert, and suggests annotating Id with #[derive(Hash)].</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="248" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">sh — rustc 1.83.0</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">rustc --edition 2021 bound.rs</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="70">error[E0277]: the trait bound `Id: Hash` is not satisfied</text>
  <text class="mono path" xml:space="preserve" x="16" y="88"> --&gt; bound.rs:8:10</text>
  <text class="mono dim" xml:space="preserve" x="16" y="106">  |</text>
  <text class="mono detail" xml:space="preserve" x="16" y="124">8 |     seen.insert(Id(1));</text>
  <text class="mono caret" xml:space="preserve" x="16" y="142">  |          ^^^^^^ the trait `Hash` is not implemented for `Id`</text>
  <text class="mono dim" xml:space="preserve" x="16" y="160">  |</text>
  <text class="mono detail" xml:space="preserve" x="16" y="178">note: required by a bound in `HashSet::&lt;T, S&gt;::insert`</text>
  <text class="mono roll" xml:space="preserve" x="16" y="196">help: consider annotating `Id` with `#[derive(Hash)]`</text>
  <text class="mono ok" xml:space="preserve" x="16" y="226">↑ "required by a bound in ..." names who demanded the trait — that is the real answer.</text>
</svg>
