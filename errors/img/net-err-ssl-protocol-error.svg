<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 324" width="700" height="324" role="img" aria-labelledby="neterrsslprotocolerrT neterrsslprotocolerrD">
  <title id="neterrsslprotocolerrT">Chrome error page reading This site cannot provide a secure connection, sent an invalid response, ERR_SSL_PROTOCOL_ERROR</title>
  <desc id="neterrsslprotocolerrD">Chrome's error page after requesting https against a port that speaks plain HTTP. The heading reads This site can't provide a secure connection and the body says the host sent an invalid response. The error code is ERR_SSL_PROTOCOL_ERROR.</desc>
  <style>
    .page{fill:#ffffff}
    .chrome{fill:#dee1e6}
    .omnibox{fill:#ffffff}
    .h1{fill:#202124;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:21px}
    .p{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px}
    .code{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.3px}
    .btn{fill:#1a73e8}
    .btntext{fill:#ffffff;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600}
    .urltext{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px}
    .bullet{fill:#5f6368}
    .tab{fill:#ffffff}
    .tabtext{fill:#3c4043;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
  </style>

  <rect class="page" x="0" y="0" width="700" height="324" rx="8"/>
  <rect class="chrome" x="0" y="0" width="700" height="64" rx="8"/>
  <rect class="chrome" x="0" y="40" width="700" height="24"/>
  <rect class="tab" x="10" y="8" width="200" height="28" rx="6"/>
  <text class="tabtext" x="24" y="27">This site can't provide a </text>
  <rect class="omnibox" x="10" y="40" width="680" height="22" rx="11"/>
  <text class="urltext" x="26" y="55">https://localhost:8080/</text>

  <text class="h1" x="48" y="118">This site can't provide a secure connection</text>
  <text class="p" x="48" y="152">localhost sent an invalid response.</text>
  <text class="p" x="48" y="181">Try:</text>
  <circle class="bullet" cx="54" cy="199" r="2"/>
  <text class="p" x="66" y="203">Try running Windows Network Diagnostics.</text>
  <text class="code" x="48" y="238">ERR_SSL_PROTOCOL_ERROR</text>
  <rect class="btn" x="48" y="264" width="86" height="32" rx="16"/>
  <text class="btntext" x="91" y="285" text-anchor="middle">Reload</text>
</svg>
