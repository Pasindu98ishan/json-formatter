<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 155" width="700" height="155" role="img" aria-labelledby="cannotconvertundefinT cannotconvertundefinD">
  <title id="cannotconvertundefinT">Chrome DevTools console showing Uncaught TypeError: Cannot convert undefined or null to object</title>
  <desc id="cannotconvertundefinD">The Chrome DevTools Console panel showing a red error row reading Uncaught TypeError: Cannot convert undefined or null to object, with an expanded stack whose first frame is at Object.keys (&lt;anonymous&gt;) and whose second is at app.js line 3. The frame names which built-in rejected the value.</desc>
  <style>
    .bg{fill:#202124}
    .bar{fill:#292a2d}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .err{fill:#f28b82}
    .warn{fill:#fdd663}
    .logtext{fill:#e8eaed}
    .src{fill:#8ab4f8;font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:11px}
    .ico{fill:#202124;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:9px;font-weight:700}
    .tab{fill:#9aa0a6;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .tabon{fill:#8ab4f8;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:600}
    .note{fill:#9aa0a6}
    .frame{fill:#9aa0a6}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="155" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="30" rx="8"/>
  <rect class="bar" x="0" y="22" width="700" height="8"/>
  <text class="tab" x="14" y="19">Elements</text>
  <text class="tabon" x="74" y="19">Console</text>
  <text class="tab" x="132" y="19">Sources</text>
  <text class="tab" x="186" y="19">Network</text>
  <rect x="72" y="26" width="52" height="2" fill="#8ab4f8"/>
  <text class="tab" x="686" y="19" text-anchor="end">DevTools &#8212; Chrome 152</text>

  <rect x="0" y="42" width="700" height="31" fill="#2c1b1c"/>
  <rect x="0" y="42" width="700" height="1" fill="#5c2b2b"/>
  <circle cx="16" cy="54" r="5.5" fill="#f85149"/>
  <text class="ico" x="16" y="58" text-anchor="middle">!</text>
  <text class="mono err" xml:space="preserve" x="30" y="58">Uncaught TypeError: Cannot convert undefined or null to object</text>
  <text class="src" x="686" y="58" text-anchor="end">app.js:3</text>
  <text class="mono frame" xml:space="preserve" x="46" y="93">at Object.keys (&lt;anonymous&gt;)</text>
  <text class="mono frame" xml:space="preserve" x="46" y="110">at app.js:3:8</text>
  <text class="mono note" x="16" y="137">The first frame names the built-in that rejected it — here Object.keys.</text>
</svg>
