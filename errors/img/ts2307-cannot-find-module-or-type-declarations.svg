<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 170" width="740" height="170" role="img" aria-labelledby="ts2307cannotfindmoduT ts2307cannotfindmoduD">
  <title id="ts2307cannotfindmoduT">Terminal showing tsc error TS2307 Cannot find module or its corresponding type declarations</title>
  <desc id="ts2307cannotfindmoduD">A terminal running npx tsc -p . with pretty output. tsc reports app.ts line 1 column 27, error TS2307: Cannot find module './table' or its corresponding type declarations. It echoes the source line import { formatRow } from "./table"; and underlines the module specifier with tildes.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="740" height="170" rx="8"/>
  <rect class="bar" x="0" y="0" width="740" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="740" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="370" y="18" text-anchor="middle">bash — TypeScript 5.9.3</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">npx tsc -p .</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="70">app.ts:1:27 - error TS2307: Cannot find module './table' or its corresponding type declarations.</text>
  <text class="mono detail" xml:space="preserve" x="16" y="100">1 import { formatRow } from "./table";</text>
  <text class="mono caret" xml:space="preserve" x="16" y="118">                            ~~~~~~~~~</text>
  <text class="mono ok" xml:space="preserve" x="16" y="148">↑ TS2307 is about TYPES, not runtime — the file may exist and still have no declarations.</text>
</svg>
