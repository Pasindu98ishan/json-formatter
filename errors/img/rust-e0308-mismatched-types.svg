<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 284" width="700" height="284" role="img" aria-labelledby="ruste0308mismatchedtT ruste0308mismatchedtD">
  <title id="ruste0308mismatchedtT">Terminal showing rustc error E0308 mismatched types expected i32 found i64 with a help suggestion</title>
  <desc id="ruste0308mismatchedtD">A terminal running rustc. The compiler reports error[E0308]: mismatched types at e0308.rs line 3, underlines count with expected i32, found i64, marks the annotation with expected due to this, and then offers a help block suggesting count.try_into().unwrap() to convert an i64 to an i32 and panic if the value does not fit.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="284" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">sh — rustc 1.83.0</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">rustc --edition 2021 e0308.rs</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="70">error[E0308]: mismatched types</text>
  <text class="mono path" xml:space="preserve" x="16" y="88"> --&gt; e0308.rs:3:22</text>
  <text class="mono dim" xml:space="preserve" x="16" y="106">  |</text>
  <text class="mono detail" xml:space="preserve" x="16" y="124">3 |     let limit: i32 = count;</text>
  <text class="mono caret" xml:space="preserve" x="16" y="142">  |                ---   ^^^^^ expected `i32`, found `i64`</text>
  <text class="mono dim" xml:space="preserve" x="16" y="160">  |                |</text>
  <text class="mono detail" xml:space="preserve" x="16" y="178">  |                expected due to this</text>
  <text class="mono roll" xml:space="preserve" x="16" y="196">help: you can convert an `i64` to an `i32` and panic if it does not fit</text>
  <text class="mono detail" xml:space="preserve" x="16" y="214">3 |     let limit: i32 = count.try_into().unwrap();</text>
  <text class="mono caret" xml:space="preserve" x="16" y="232">  |                           ++++++++++++++++++++</text>
  <text class="mono ok" xml:space="preserve" x="16" y="262">↑ rustc writes the fix for you — the help block is copy-pasteable.</text>
</svg>
