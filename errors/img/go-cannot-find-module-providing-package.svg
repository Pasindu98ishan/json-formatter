<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 140" width="700" height="140" role="img" aria-labelledby="gocannotfindmoduleprT gocannotfindmoduleprD">
  <title id="gocannotfindmoduleprT">Terminal showing Go reporting no required module provides package, suggesting go get</title>
  <desc id="gocannotfindmoduleprD">A terminal running go build. Go reports main.go:6:2: no required module provides package github.com/gorilla/mux; to add it: followed by an indented go get github.com/gorilla/mux. The suggestion Go prints is always go get for the specific path, never go mod tidy.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="140" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">sh — go1.23.12 linux/amd64</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">go build ./...</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="70">main.go:6:2: no required module provides package github.com/gorilla/mux; to add it:</text>
  <text class="mono detail" xml:space="preserve" x="16" y="88">        go get github.com/gorilla/mux</text>
  <text class="mono ok" xml:space="preserve" x="16" y="118">↑ Go always suggests "go get &lt;path&gt;" — never "go mod tidy", though that works too.</text>
</svg>
