<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" width="760" height="242" role="img" aria-labelledby="corspreflightdoesnotT corspreflightdoesnotD">
  <title id="corspreflightdoesnotT">Chrome DevTools console showing a CORS preflight failure with net::ERR_FAILED and Failed to fetch</title>
  <desc id="corspreflightdoesnotD">The Chrome DevTools Console panel showing the three lines a blocked preflight produces together: the CORS policy message saying Response to preflight request doesn't pass access control check because no Access-Control-Allow-Origin header is present, a Failed to load resource: net::ERR_FAILED line, and the JavaScript promise rejection reading Failed to fetch.</desc>
  <style>
    .bg{fill:#202124}
    .bar{fill:#292a2d}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .err{fill:#f28b82}
    .warn{fill:#fdd663}
    .logtext{fill:#e8eaed}
    .src{fill:#8ab4f8;font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:11px}
    .ico{fill:#202124;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:9px;font-weight:700}
    .tab{fill:#9aa0a6;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .tabon{fill:#8ab4f8;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:600}
    .note{fill:#9aa0a6}
  </style>

  <rect class="bg" x="0" y="0" width="760" height="242" rx="8"/>
  <rect class="bar" x="0" y="0" width="760" height="30" rx="8"/>
  <rect class="bar" x="0" y="22" width="760" height="8"/>
  <text class="tab" x="14" y="19">Elements</text>
  <text class="tabon" x="74" y="19">Console</text>
  <text class="tab" x="132" y="19">Sources</text>
  <text class="tab" x="186" y="19">Network</text>
  <rect x="72" y="26" width="52" height="2" fill="#8ab4f8"/>
  <text class="tab" x="746" y="19" text-anchor="end">DevTools &#8212; Chrome 152</text>

  <rect x="0" y="42" width="760" height="82" fill="#2c1b1c"/>
  <rect x="0" y="42" width="760" height="1" fill="#5c2b2b"/>
  <circle cx="16" cy="54" r="5.5" fill="#f85149"/>
  <text class="ico" x="16" y="58" text-anchor="middle">!</text>
  <text class="mono err" xml:space="preserve" x="30" y="58">Access to fetch at 'https://api.example.com/v1/orders' from origin</text>
  <text class="mono err" xml:space="preserve" x="30" y="75">'https://app.example.com' has been blocked by CORS policy: Response to</text>
  <text class="mono err" xml:space="preserve" x="30" y="92">preflight request doesn't pass access control check: No</text>
  <text class="mono err" xml:space="preserve" x="30" y="109">'Access-Control-Allow-Origin' header is present on the requested resource.</text>
  <text class="src" x="746" y="58" text-anchor="end">app.js:1</text>
  <rect x="0" y="128" width="760" height="31" fill="#2c1b1c"/>
  <rect x="0" y="128" width="760" height="1" fill="#5c2b2b"/>
  <circle cx="16" cy="140" r="5.5" fill="#f85149"/>
  <text class="ico" x="16" y="144" text-anchor="middle">!</text>
  <text class="mono err" xml:space="preserve" x="30" y="144">Failed to load resource: net::ERR_FAILED</text>
  <text class="src" x="746" y="144" text-anchor="end">orders:1</text>
  <rect x="0" y="163" width="760" height="1" fill="#2f2f2f"/>
  <circle cx="16" cy="175" r="5.5" fill="#8b949e"/>
  <text class="ico" x="16" y="179" text-anchor="middle"></text>
  <text class="mono logtext" xml:space="preserve" x="30" y="179">fetch rejected: Failed to fetch</text>
  <text class="src" x="746" y="179" text-anchor="end">app.js:6</text>
  <text class="mono note" x="16" y="224">One blocked preflight, three different messages — the first one is the only diagnostic one.</text>
</svg>
