<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" role="img" aria-labelledby="javaclassnotfoundexcT javaclassnotfoundexcD">
  <title id="javaclassnotfoundexcT">Terminal contrasting ClassNotFoundException with NoClassDefFoundError and its Caused by line</title>
  <desc id="javaclassnotfoundexcD">A terminal showing the two errors side by side. First, java Reflect calls Class.forName on org.postgresql.Driver and throws java.lang.ClassNotFoundException: org.postgresql.Driver from Class.forName. Second, Helper.class is deleted after a successful compile and java App throws java.lang.NoClassDefFoundError: Helper, followed by a Caused by: java.lang.ClassNotFoundException: Helper line. NoClassDefFoundError wraps a ClassNotFoundException: the class linked at compile time but was missing at first use.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="260" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">bash — OpenJDK 21.0.11</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">java Reflect          # Class.forName("org.postgresql.Driver")</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="70">Exception in thread "main" java.lang.ClassNotFoundException: org.postgresql.Driver</text>
  <text class="mono detail" xml:space="preserve" x="16" y="88">        at java.base/java.lang.Class.forName(Class.java:414)</text>
  <text class="mono detail" xml:space="preserve" x="16" y="106">        at Reflect.main(Reflect.java:3)</text>
  <text class="mono" xml:space="preserve" x="16" y="136"><tspan class="prompt">$ </tspan><tspan class="cmd">rm Helper.class &amp;&amp; java App   # compiled fine, class gone at runtime</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="154">Exception in thread "main" java.lang.NoClassDefFoundError: Helper</text>
  <text class="mono detail" xml:space="preserve" x="16" y="172">        at App.main(App.java:3)</text>
  <text class="mono roll" xml:space="preserve" x="16" y="190">Caused by: java.lang.ClassNotFoundException: Helper</text>
  <text class="mono detail" xml:space="preserve" x="16" y="208">        ... 1 more</text>
  <text class="mono ok" xml:space="preserve" x="16" y="238">↑ NoClassDefFoundError wraps a ClassNotFoundException — always read the "Caused by" line.</text>
</svg>
