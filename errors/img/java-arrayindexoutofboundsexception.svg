<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 140" width="780" height="140" role="img" aria-labelledby="javaarrayindexoutofbT javaarrayindexoutofbD">
  <title id="javaarrayindexoutofbT">Terminal showing java.lang.ArrayIndexOutOfBoundsException from an off-by-one loop</title>
  <desc id="javaarrayindexoutofbD">A terminal running javac Report.java followed by java Report. The program declares int[] totals = new int[3] and loops with i &lt;= totals.length. The JVM throws Exception in thread main java.lang.ArrayIndexOutOfBoundsException: Index 3 out of bounds for length 3, with the stack frame at Report.main(Report.java:5). Valid indexes for a length-3 array are 0, 1 and 2, so index 3 is one past the end.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="780" height="140" rx="8"/>
  <rect class="bar" x="0" y="0" width="780" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="780" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="390" y="18" text-anchor="middle">bash — OpenJDK 21.0.11</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">javac Report.java &amp;&amp; java Report</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="70">Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException: Index 3 out of bounds for length 3</text>
  <text class="mono detail" xml:space="preserve" x="16" y="88">        at Report.main(Report.java:5)</text>
  <text class="mono ok" xml:space="preserve" x="16" y="118">↑ "length 3" means the only valid indexes are 0, 1, 2 — the loop ran to i=3 (i &lt;= length).</text>
</svg>
