<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 366" width="700" height="366" role="img" aria-labelledby="neterrconnectiontimeT neterrconnectiontimeD">
  <title id="neterrconnectiontimeT">Chrome error page reading This site cannot be reached, took too long to respond, ERR_CONNECTION_TIMED_OUT</title>
  <desc id="neterrconnectiontimeD">Chrome's error page after a request to an unroutable address hung until the TCP timeout. The heading reads This site can't be reached, the body says the host took too long to respond, and Chrome lists Checking the connection, Checking the proxy and the firewall, and Running Windows Network Diagnostics. The error code is ERR_CONNECTION_TIMED_OUT.</desc>
  <style>
    .page{fill:#ffffff}
    .chrome{fill:#dee1e6}
    .omnibox{fill:#ffffff}
    .h1{fill:#202124;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:21px}
    .p{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px}
    .code{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.3px}
    .btn{fill:#1a73e8}
    .btntext{fill:#ffffff;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600}
    .urltext{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px}
    .bullet{fill:#5f6368}
    .tab{fill:#ffffff}
    .tabtext{fill:#3c4043;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
  </style>

  <rect class="page" x="0" y="0" width="700" height="366" rx="8"/>
  <rect class="chrome" x="0" y="0" width="700" height="64" rx="8"/>
  <rect class="chrome" x="0" y="40" width="700" height="24"/>
  <rect class="tab" x="10" y="8" width="200" height="28" rx="6"/>
  <text class="tabtext" x="24" y="27">This site can't be reached</text>
  <rect class="omnibox" x="10" y="40" width="680" height="22" rx="11"/>
  <text class="urltext" x="26" y="55">http://api.internal.example.com/v1/orders</text>

  <text class="h1" x="48" y="118">This site can't be reached</text>
  <text class="p" x="48" y="152">api.internal.example.com took too long to respond.</text>
  <text class="p" x="48" y="181">Try:</text>
  <circle class="bullet" cx="54" cy="199" r="2"/>
  <text class="p" x="66" y="203">Checking the connection</text>
  <circle class="bullet" cx="54" cy="220" r="2"/>
  <text class="p" x="66" y="224">Checking the proxy and the firewall</text>
  <circle class="bullet" cx="54" cy="241" r="2"/>
  <text class="p" x="66" y="245">Running Windows Network Diagnostics</text>
  <text class="code" x="48" y="280">ERR_CONNECTION_TIMED_OUT</text>
  <rect class="btn" x="48" y="306" width="86" height="32" rx="16"/>
  <text class="btntext" x="91" y="327" text-anchor="middle">Reload</text>
</svg>
