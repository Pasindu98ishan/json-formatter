<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 345" width="700" height="345" role="img" aria-labelledby="neterrinternetdisconT neterrinternetdisconD">
  <title id="neterrinternetdisconT">Chrome offline error page listing network checks with the code ERR_INTERNET_DISCONNECTED</title>
  <desc id="neterrinternetdisconD">Chrome's offline error page, reproduced by forcing the browser offline. It offers three suggestions — Checking the network cables, modem and router; Reconnecting to Wi-Fi; and Running Windows Network Diagnostics — above the error code ERR_INTERNET_DISCONNECTED. Every suggestion concerns local connectivity, because Chrome decided the machine has no network at all rather than that a particular server was unreachable.</desc>
  <style>
    .page{fill:#ffffff}
    .chrome{fill:#dee1e6}
    .omnibox{fill:#ffffff}
    .h1{fill:#202124;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:21px}
    .p{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px}
    .code{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.3px}
    .btn{fill:#1a73e8}
    .btntext{fill:#ffffff;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600}
    .urltext{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px}
    .bullet{fill:#5f6368}
    .tab{fill:#ffffff}
    .tabtext{fill:#3c4043;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
  </style>

  <rect class="page" x="0" y="0" width="700" height="345" rx="8"/>
  <rect class="chrome" x="0" y="0" width="700" height="64" rx="8"/>
  <rect class="chrome" x="0" y="40" width="700" height="24"/>
  <rect class="tab" x="10" y="8" width="200" height="28" rx="6"/>
  <text class="tabtext" x="24" y="27">No internet</text>
  <rect class="omnibox" x="10" y="40" width="680" height="22" rx="11"/>
  <text class="urltext" x="26" y="55">http://app.example.com/dashboard</text>

  <text class="h1" x="48" y="118">No internet</text>
  <text class="p" x="48" y="160">Try:</text>
  <circle class="bullet" cx="54" cy="178" r="2"/>
  <text class="p" x="66" y="182">Checking the network cables, modem and router</text>
  <circle class="bullet" cx="54" cy="199" r="2"/>
  <text class="p" x="66" y="203">Reconnecting to Wi-Fi</text>
  <circle class="bullet" cx="54" cy="220" r="2"/>
  <text class="p" x="66" y="224">Running Windows Network Diagnostics</text>
  <text class="code" x="48" y="259">ERR_INTERNET_DISCONNECTED</text>
  <rect class="btn" x="48" y="285" width="86" height="32" rx="16"/>
  <text class="btntext" x="91" y="306" text-anchor="middle">Reload</text>
</svg>
