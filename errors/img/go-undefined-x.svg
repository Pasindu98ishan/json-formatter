<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 158" width="700" height="158" role="img" aria-labelledby="goundefinedxT goundefinedxD">
  <title id="goundefinedxT">Terminal showing the Go compiler error undefined: calculateTotal and undefined: items</title>
  <desc id="goundefinedxD">A terminal running go build. The compiler reports ./undef.go:4:11: undefined: calculateTotal and ./undef.go:4:26: undefined: items — one error per unresolved name, each with its own line and column.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="158" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">sh — go1.23.12 linux/amd64</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">go build ./undef.go</tspan></text>
  <text class="mono dim" xml:space="preserve" x="16" y="70"># command-line-arguments</text>
  <text class="mono err" xml:space="preserve" x="16" y="88">./undef.go:4:11: undefined: calculateTotal</text>
  <text class="mono err" xml:space="preserve" x="16" y="106">./undef.go:4:26: undefined: items</text>
  <text class="mono ok" xml:space="preserve" x="16" y="136">↑ One error per unresolved name, each with its own line:column — fix them together.</text>
