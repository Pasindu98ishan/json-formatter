<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 302" width="700" height="302" role="img" aria-labelledby="ruste0597doesnotliveT ruste0597doesnotliveD">
  <title id="ruste0597doesnotliveT">Terminal showing rustc error E0597 name does not live long enough with the full borrow timeline</title>
  <desc id="ruste0597doesnotliveD">A terminal running rustc. The compiler reports error[E0597]: `name` does not live long enough at e0597.rs line 5 and annotates four separate lines: binding `name` declared here, borrowed value does not live long enough, `name` dropped here while still borrowed at the closing brace, and borrow later used here at the println. Together these four spans show the whole lifetime conflict.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="302" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">sh — rustc 1.83.0</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">rustc --edition 2021 e0597.rs</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="70">error[E0597]: `name` does not live long enough</text>
  <text class="mono path" xml:space="preserve" x="16" y="88"> --&gt; e0597.rs:5:18</text>
  <text class="mono dim" xml:space="preserve" x="16" y="106">  |</text>
  <text class="mono detail" xml:space="preserve" x="16" y="124">4 |         let name = String::from("ada");</text>
  <text class="mono caret" xml:space="preserve" x="16" y="142">  |             ---- binding `name` declared here</text>
  <text class="mono detail" xml:space="preserve" x="16" y="160">5 |         result = &amp;name;</text>
  <text class="mono caret" xml:space="preserve" x="16" y="178">  |                  ^^^^^ borrowed value does not live long enough</text>
  <text class="mono detail" xml:space="preserve" x="16" y="196">6 |     }</text>
  <text class="mono roll" xml:space="preserve" x="16" y="214">  |     - `name` dropped here while still borrowed</text>
  <text class="mono detail" xml:space="preserve" x="16" y="232">7 |     println!("{}", result);</text>
  <text class="mono caret" xml:space="preserve" x="16" y="250">  |                    ------ borrow later used here</text>
  <text class="mono ok" xml:space="preserve" x="16" y="280">↑ Four spans = the whole timeline: declared → borrowed → dropped → used.</text>
</svg>
