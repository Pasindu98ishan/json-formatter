<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Which Python types convert to JSON</title>
  <desc id="d">json.dumps converts dict, list, str, int, float, bool and None directly. datetime, Decimal, set, bytes, UUID and custom classes have no JSON equivalent and raise TypeError unless a default function or custom encoder converts them.</desc>
  <style>
    text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Consolas',monospace}
    .title{fill:#1a1a1a;font-weight:700}.caption{fill:#555}.muted{fill:#6c757d}
    .card-fill{fill:#f8f9fa}.card-stroke{stroke:#dee2e6}
    .ok-fill{fill:#d4edda}.ok-text{fill:#155724}
    .bad-fill{fill:#f8d7da}.bad-text{fill:#721c24}
  </style>
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" class="title" font-size="16">What json.dumps() can and cannot convert</text>
  <rect class="card-fill card-stroke" x="24" y="44" width="288" height="186" rx="12"/>
  <rect class="ok-fill" x="24" y="44" width="288" height="30" rx="12"/>
  <text x="168" y="64" text-anchor="middle" class="ok-text" font-size="13" font-weight="700">Converts directly &#10003;</text>
  <text x="44" y="98"  class="mono ok-text" font-size="13">dict&#8195; &rarr; object</text>
  <text x="44" y="122" class="mono ok-text" font-size="13">list, tuple &rarr; array</text>
  <text x="44" y="146" class="mono ok-text" font-size="13">str&#8195;&#8194; &rarr; string</text>
  <text x="44" y="170" class="mono ok-text" font-size="13">int, float &rarr; number</text>
  <text x="44" y="194" class="mono ok-text" font-size="13">True / False &rarr; true / false</text>
  <text x="44" y="218" class="mono ok-text" font-size="13">None&#8194; &rarr; null</text>
  <rect class="card-fill card-stroke" x="328" y="44" width="288" height="186" rx="12"/>
  <rect class="bad-fill" x="328" y="44" width="288" height="30" rx="12"/>
  <text x="472" y="64" text-anchor="middle" class="bad-text" font-size="13" font-weight="700">Raises TypeError &#10007;</text>
  <text x="348" y="98"  class="mono bad-text" font-size="13">datetime, date</text>
  <text x="348" y="122" class="mono bad-text" font-size="13">Decimal</text>
  <text x="348" y="146" class="mono bad-text" font-size="13">set, frozenset</text>
  <text x="348" y="170" class="mono bad-text" font-size="13">bytes</text>
  <text x="348" y="194" class="mono bad-text" font-size="13">UUID, numpy types</text>
  <text x="348" y="218" class="mono bad-text" font-size="13">your custom class</text>
  <text x="320" y="262" text-anchor="middle" class="caption" font-size="13">Bridge the gap with json.dumps(obj, default=...) or a custom JSONEncoder</text>
  <text x="320" y="284" text-anchor="middle" class="muted" font-size="12">datetime &rarr; .isoformat()   Decimal &rarr; float()   set &rarr; list()</text>
</svg>
