<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 206" width="700" height="206" role="img" aria-labelledby="gopanicinterfaceconvT gopanicinterfaceconvD">
  <title id="gopanicinterfaceconvT">Terminal showing a Go panic: interface conversion: interface {} is string, not int</title>
  <desc id="gopanicinterfaceconvD">A terminal running go run. The program unmarshals JSON into a map[string]interface{} and then type-asserts payload["port"] to int. It panics with interface conversion: interface {} is string, not int, because encoding/json decoded the JSON string "8080" as a Go string. The goroutine trace points at assert.go line 11 and the process exits with status 2.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="206" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">sh — go1.23.12 linux/amd64</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">go run assert.go     # payload["port"].(int), JSON had "8080"</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="70">panic: interface conversion: interface {} is string, not int</text>
  <text class="mono dim" xml:space="preserve" x="16" y="100">goroutine 1 [running]:</text>
  <text class="mono detail" xml:space="preserve" x="16" y="118">main.main()</text>
  <text class="mono detail" xml:space="preserve" x="16" y="136">        /tmp/c/assert.go:11 +0xec</text>
  <text class="mono roll" xml:space="preserve" x="16" y="154">exit status 2</text>
  <text class="mono ok" xml:space="preserve" x="16" y="184">↑ encoding/json decodes every JSON number as float64 and every string as string.</text>
</svg>
