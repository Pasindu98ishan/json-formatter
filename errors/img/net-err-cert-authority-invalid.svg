<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 315" width="700" height="315" role="img" aria-labelledby="neterrcertauthorityiT neterrcertauthorityiD">
  <title id="neterrcertauthorityiT">Chrome security warning reading Your connection is not private with code NET::ERR_CERT_AUTHORITY_INVALID</title>
  <desc id="neterrcertauthorityiD">Chrome's security interstitial for a certificate signed by an authority the browser does not trust. The heading reads Your connection is not private and the body warns that attackers might be trying to steal information. The code is written NET::ERR_CERT_AUTHORITY_INVALID in capitals on this screen, unlike the lowercase net:: form the console uses.</desc>
  <style>
    .page{fill:#ffffff}
    .chrome{fill:#dee1e6}
    .omnibox{fill:#ffffff}
    .h1{fill:#202124;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:21px}
    .p{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px}
    .code{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.3px}
    .btn{fill:#1a73e8}
    .btntext{fill:#ffffff;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600}
    .urltext{fill:#5f6368;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px}
    .bullet{fill:#5f6368}
    .tab{fill:#ffffff}
    .tabtext{fill:#3c4043;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
  </style>

  <rect class="page" x="0" y="0" width="700" height="315" rx="8"/>
  <rect class="chrome" x="0" y="0" width="700" height="64" rx="8"/>
  <rect class="chrome" x="0" y="40" width="700" height="24"/>
  <rect class="tab" x="10" y="8" width="200" height="28" rx="6"/>
  <text class="tabtext" x="24" y="27">Your connection is not pri</text>
  <rect class="omnibox" x="10" y="40" width="680" height="22" rx="11"/>
  <text class="urltext" x="26" y="55">https://staging.example.com/</text>

  <text class="h1" x="48" y="118">Your connection is not private</text>
  <text class="p" x="48" y="152">Attackers might be trying to steal your information from</text>
  <text class="p" x="48" y="173">staging.example.com (for example, passwords, messages or</text>
  <text class="p" x="48" y="194">credit cards).</text>
  <text class="code" x="48" y="229">NET::ERR_CERT_AUTHORITY_INVALID</text>
  <rect class="btn" x="48" y="255" width="86" height="32" rx="16"/>
  <text class="btntext" x="91" y="276" text-anchor="middle">Reload</text>
</svg>
