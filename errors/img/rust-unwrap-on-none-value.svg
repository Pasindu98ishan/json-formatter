<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 158" width="700" height="158" role="img" aria-labelledby="rustunwraponnonevaluT rustunwraponnonevaluD">
  <title id="rustunwraponnonevaluT">Terminal showing a Rust panic: called Option::unwrap() on a None value</title>
  <desc id="rustunwraponnonevaluD">A terminal running a compiled Rust binary. It panics with thread main panicked at unwrap.rs line 4 column 26, called `Option::unwrap()` on a `None` value, and notes that running with RUST_BACKTRACE=1 will display a backtrace. The find call returned None because no element matched.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="158" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">sh — rustc 1.83.0</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">rustc --edition 2021 unwrap.rs -o u &amp;&amp; ./u</tspan></text>
  <text class="mono err" xml:space="preserve" x="16" y="70">thread 'main' panicked at unwrap.rs:4:26:</text>
  <text class="mono err" xml:space="preserve" x="16" y="88">called `Option::unwrap()` on a `None` value</text>
  <text class="mono detail" xml:space="preserve" x="16" y="106">note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace</text>
  <text class="mono ok" xml:space="preserve" x="16" y="136">↑ line:column points at the .unwrap() itself — 4:26 is the call, not the None source.</text>
