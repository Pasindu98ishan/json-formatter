<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-labelledby="ciTitle ciDesc">
  <title id="ciTitle">The same circular import producing two different diagnoses on Python 3.12 and 3.13</title>
  <desc id="ciDesc">A terminal showing the identical two-module circular import run under two Python versions. Under python 3.12 the traceback ends with ImportError cannot import name Order from partially initialized module orders, most likely due to a circular import. Under python 3.13 the identical code ends with ImportError cannot import name Order from orders, consider renaming slash app slash orders dot py if it has the same name as a library you intended to import. The circular import wording is gone and has been replaced by a shadowing suggestion, even though nothing about the code changed.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .cmd{fill:#e6edf3}
    .frame{fill:#8b949e}
    .src{fill:#a9b4c0}
    .err{fill:#ff7b72;font-weight:700}
    .hint1{fill:#ffa657;font-weight:700}
    .hint2{fill:#79c0ff;font-weight:700}
    .rule{stroke:#3d444d;stroke-width:1}
    .tag{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10px;font-weight:700}
  </style>

  <rect class="bg" x="0" y="0" width="760" height="356" rx="8"/>
  <rect class="bar" x="0" y="0" width="760" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="760" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="380" y="18" text-anchor="middle">orders.py and customers.py import each other &#8212; unchanged between both runs</text>

  <!-- ===== Python 3.12 run ===== -->
  <text class="mono" x="16" y="52">
    <tspan class="prompt">$ </tspan><tspan class="cmd">docker run --rm -v "$PWD:/app" -w /app python:3.12-slim python -c "import orders"</tspan>
  </text>
  <text class="mono frame" x="16" y="70">Traceback (most recent call last):</text>
  <text class="mono frame" x="16" y="86">  File &quot;&lt;string&gt;&quot;, line 1, in &lt;module&gt;</text>
  <text class="mono frame" x="16" y="102">  File &quot;/app/orders.py&quot;, line 1, in &lt;module&gt;</text>
  <text class="mono src" x="16" y="118">    from customers import Customer</text>
  <text class="mono frame" x="16" y="134">  File &quot;/app/customers.py&quot;, line 1, in &lt;module&gt;</text>
  <text class="mono src" x="16" y="150">    from orders import Order</text>
  <text class="mono" x="16" y="168">
    <tspan class="err">ImportError: cannot import name 'Order' from partially initialized</tspan>
  </text>
  <text class="mono" x="16" y="184">
    <tspan class="err">module 'orders' </tspan><tspan class="hint1">(most likely due to a circular import)</tspan><tspan class="err"> (/app/orders.py)</tspan>
  </text>
  <rect x="612" y="158" width="132" height="18" rx="4" fill="#ffa657" opacity="0.16"/>
  <text class="tag" x="678" y="171" text-anchor="middle" fill="#ffa657">correct diagnosis</text>

  <line class="rule" x1="16" y1="204" x2="744" y2="204"/>

  <!-- ===== Python 3.13 run ===== -->
  <text class="mono" x="16" y="228">
    <tspan class="prompt">$ </tspan><tspan class="cmd">docker run --rm -v "$PWD:/app" -w /app python:3.13-slim python -c "import orders"</tspan>
  </text>
  <text class="mono frame" x="16" y="246">Traceback (most recent call last):</text>
  <text class="mono frame" x="16" y="262">  File &quot;&lt;string&gt;&quot;, line 1, in &lt;module&gt;</text>
  <text class="mono src" x="16" y="278">    import orders</text>
  <text class="mono frame" x="16" y="294">  File &quot;/app/orders.py&quot;, line 1, in &lt;module&gt;</text>
  <text class="mono src" x="16" y="310">    from customers import Customer</text>
  <text class="mono" x="16" y="328">
    <tspan class="err">ImportError: cannot import name 'Order' from 'orders' </tspan><tspan class="hint2">(consider</tspan>
  </text>
  <text class="mono" x="16" y="344">
    <tspan class="hint2">renaming '/app/orders.py' if it has the same name as a library&#8230;)</tspan>
  </text>
  <rect x="596" y="318" width="148" height="18" rx="4" fill="#79c0ff" opacity="0.16"/>
  <text class="tag" x="670" y="331" text-anchor="middle" fill="#79c0ff">wrong &#8212; there is no library</text>
</svg>
