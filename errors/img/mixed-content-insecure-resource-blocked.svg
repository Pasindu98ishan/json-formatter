<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 275" width="780" height="275" role="img" aria-labelledby="mixedcontentinsecureT mixedcontentinsecureD">
  <title id="mixedcontentinsecureT">Chrome DevTools console showing mixed content: an insecure script blocked and an insecure image auto-upgraded</title>
  <desc id="mixedcontentinsecureD">The Chrome DevTools Console panel showing the two different outcomes Chrome applies to mixed content. An insecure script is reported as blocked with the message this request has been blocked; the content must be served over HTTPS. An insecure image on the same page is instead reported as automatically upgraded to HTTPS, with a link to the Chromium blog post about mixed messages. Active content is blocked; passive content is upgraded.</desc>
  <style>
    .bg{fill:#202124}
    .bar{fill:#292a2d}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .err{fill:#f28b82}
    .warn{fill:#fdd663}
    .logtext{fill:#e8eaed}
    .src{fill:#8ab4f8;font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:11px}
    .ico{fill:#202124;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:9px;font-weight:700}
    .tab{fill:#9aa0a6;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .tabon{fill:#8ab4f8;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:600}
    .note{fill:#9aa0a6}
    .frame{fill:#9aa0a6}
  </style>

  <rect class="bg" x="0" y="0" width="780" height="275" rx="8"/>
  <rect class="bar" x="0" y="0" width="780" height="30" rx="8"/>
  <rect class="bar" x="0" y="22" width="780" height="8"/>
  <text class="tab" x="14" y="19">Elements</text>
  <text class="tabon" x="74" y="19">Console</text>
  <text class="tab" x="132" y="19">Sources</text>
  <text class="tab" x="186" y="19">Network</text>
  <rect x="72" y="26" width="52" height="2" fill="#8ab4f8"/>
  <text class="tab" x="766" y="19" text-anchor="end">DevTools &#8212; Chrome 152</text>

  <rect x="0" y="42" width="780" height="82" fill="#2c1b1c"/>
  <rect x="0" y="42" width="780" height="1" fill="#5c2b2b"/>
  <circle cx="16" cy="54" r="5.5" fill="#f85149"/>
  <text class="ico" x="16" y="58" text-anchor="middle">!</text>
  <text class="mono err" xml:space="preserve" x="30" y="58">Mixed Content: The page at 'https://app.example.com/' was loaded over</text>
  <text class="mono err" xml:space="preserve" x="30" y="75">HTTPS, but requested an insecure script</text>
  <text class="mono err" xml:space="preserve" x="30" y="92">'http://cdn.example.com/legacy-analytics.js'. This request has been</text>
  <text class="mono err" xml:space="preserve" x="30" y="109">blocked; the content must be served over HTTPS.</text>
  <text class="src" x="766" y="58" text-anchor="end">app:1</text>
  <rect x="0" y="128" width="780" height="99" fill="#2a2415"/>
  <rect x="0" y="128" width="780" height="1" fill="#5c4b1f"/>
  <circle cx="16" cy="140" r="5.5" fill="#d29922"/>
  <text class="ico" x="16" y="144" text-anchor="middle">!</text>
  <text class="mono warn" xml:space="preserve" x="30" y="144">Mixed Content: The page at 'https://app.example.com/' was loaded over</text>
  <text class="mono warn" xml:space="preserve" x="30" y="161">HTTPS, but requested an insecure element</text>
  <text class="mono warn" xml:space="preserve" x="30" y="178">'http://cdn.example.com/banner.png'. This request was automatically</text>
  <text class="mono warn" xml:space="preserve" x="30" y="195">upgraded to HTTPS, For more information see</text>
  <text class="mono warn" xml:space="preserve" x="30" y="212">https://blog.chromium.org/2019/10/no-more-mixed-messages-about-https.html</text>
  <text class="src" x="766" y="144" text-anchor="end">app:1</text>
  <text class="mono note" x="16" y="257">Same page, same origin: the SCRIPT is blocked, the IMAGE is silently upgraded.</text>
</svg>
