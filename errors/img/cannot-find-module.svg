<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" role="img" aria-labelledby="cannotfindmoduleT cannotfindmoduleD">
  <title id="cannotfindmoduleT">Terminal showing Error Cannot find module express with the Require stack</title>
  <desc id="cannotfindmoduleD">A terminal running node src/server.js. Node prints Error: Cannot find module 'express' followed by a Require stack listing /app/src/server.js, then stack frames through Module._resolveFilename and Module._load. The Require stack names the file that contains the broken import, which is where the fix belongs.</desc>
  <style>
    .bg{fill:#1e2227}
    .bar{fill:#2b3138}
    .mono{font-family:'JetBrains Mono','SFMono-Regular','Consolas','Menlo',monospace;font-size:12px}
    .dot1{fill:#ff5f57}.dot2{fill:#febc2e}.dot3{fill:#28c840}
    .bartext{fill:#8b949e;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
    .prompt{fill:#7ee787}
    .promptbad{fill:#ffa657;font-weight:700}
    .cmd{fill:#e6edf3}
    .ok{fill:#8b949e}
    .err{fill:#ff7b72;font-weight:700}
    .detail{fill:#a9b4c0}
    .roll{fill:#ffa657;font-weight:700}
    .warn{fill:#d29922}
    .path{fill:#79c0ff}
    .caret{fill:#ffa657;font-weight:700}
    .dim{fill:#6e7681}
  </style>

  <rect class="bg" x="0" y="0" width="700" height="260" rx="8"/>
  <rect class="bar" x="0" y="0" width="700" height="28" rx="8"/>
  <rect class="bar" x="0" y="20" width="700" height="8"/>
  <circle class="dot1" cx="18" cy="14" r="5"/>
  <circle class="dot2" cx="36" cy="14" r="5"/>
  <circle class="dot3" cx="54" cy="14" r="5"/>
  <text class="bartext" x="350" y="18" text-anchor="middle">bash — Node.js v24.15.0</text>

  <text class="mono" xml:space="preserve" x="16" y="52"><tspan class="prompt">$ </tspan><tspan class="cmd">node src/server.js</tspan></text>
  <text class="mono dim" xml:space="preserve" x="16" y="70">node:internal/modules/cjs/loader:1479</text>
  <text class="mono dim" xml:space="preserve" x="16" y="88">  throw err;</text>
  <text class="mono caret" xml:space="preserve" x="16" y="106">  ^</text>
  <text class="mono err" xml:space="preserve" x="16" y="136">Error: Cannot find module 'express'</text>
  <text class="mono roll" xml:space="preserve" x="16" y="154">Require stack:</text>
  <text class="mono path" xml:space="preserve" x="16" y="172">- /app/src/server.js</text>
  <text class="mono detail" xml:space="preserve" x="16" y="190">    at Module._resolveFilename (node:internal/modules/cjs/loader:1476:15)</text>
  <text class="mono detail" xml:space="preserve" x="16" y="208">    at Module._load (node:internal/modules/cjs/loader:1262:25)</text>
  <text class="mono ok" xml:space="preserve" x="16" y="238">↑ "Require stack" names the file holding the broken import — fix the path there.</text>
</svg>
